      - group [ref=f51e34]:
        - generic "Privacy notice and consent" [ref=f51e35] [cursor=pointer]
        - generic [ref=f51e36]:
          - paragraph [ref=f51e37]:
            - strong [ref=f51e38]: Data user.
            - text: The AIDP 2026 Organizing Committee and its HKUST-hosted conference team handle personal data under Hong Kong's Personal Data (Privacy) Ordinance and HKUST's data privacy policy.
          - paragraph [ref=f51e39]:
            - strong [ref=f51e40]: What we collect.
            - text: We collect the information entered in these forms and, for posters, one PDF file. Required fields are needed to identify you, communicate with you, administer attendance, or review the submission.
          - paragraph [ref=f51e41]:
            - strong [ref=f51e42]: Use and disclosure.
            - text: We use the information for conference administration, academic review, event communications, aggregate statistics, service security, and legal compliance. We do not sell personal data or share it for unrelated marketing. Cloudflare or Alibaba Cloud may process limited security signals when you complete verification.
          - paragraph [ref=f51e43]:
            - strong [ref=f51e44]: Retention and rights.
            - text: Live submission records and poster files are deleted after
            - strong [ref=f51e45]: "180"
            - text: days unless a longer period is legally required. You may request access, correction, or deletion by contacting
            - link "the organizers" [ref=f51e46] [cursor=pointer]:
              - /url: mailto:aidp2026hk@outlook.com
            - text: .
          - paragraph [ref=f51e47]:
            - text: Read the full
            - link "Privacy Notice and Consent" [ref=f51e48] [cursor=pointer]:
              - /url: privacy.html
            - text: before submitting. Do not include patient-identifiable, confidential clinical, or otherwise restricted material.
